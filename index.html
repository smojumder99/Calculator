<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="calculator">
        <div id="display">0123</div>

        <div id="buttons">
            <div class="numButtons">
                <button id="one" type="button">7</button>
                <button id="two" type="button">8</button>
                <button id="three" type="button">9</button>
                <button id="four" type="button">4</button>
                <button id="five" type="button">5</button>
                <button id="six" type="button">6</button>
                <button id="seven" type="button">1</button>
                <button id="eight" type="button">2</button>
                <button id="nine" type="button">3</button>
                <button id="zero" type="button">0</button>
            </div>

            <div class="otherButtons">
                <div><button id="clear">AC</button></div>
                <button type="button">+</button>
                <button type="button">-</button>
                <button type="button">&times;</button>
                <button type="button">&divide;</button>

                <button id="equalTo">=</button>
            </div>

        </div>
    </div>

</body>

</html>
